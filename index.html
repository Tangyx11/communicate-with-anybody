<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="可选择不同角色进行沉浸式对话的网页应用">
  <title>万象会客厅 · 跨时空人物对话</title>
  <style>
    :root {
      --bg: #05080d;
      --panel: rgba(13, 19, 28, 0.82);
      --panel-strong: rgba(17, 25, 36, 0.96);
      --line: rgba(153, 185, 214, 0.14);
      --line-bright: rgba(111, 207, 223, 0.32);
      --text: #edf5f7;
      --muted: #81909b;
      --accent: #83dce5;
      --accent-deep: #2e8897;
      --warm: #d8b77a;
      --danger: #e07972;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 74% 18%, rgba(37, 96, 108, 0.12), transparent 28%),
        radial-gradient(circle at 20% 82%, rgba(121, 92, 50, 0.08), transparent 28%),
        var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: 0.25;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app-shell {
      position: relative;
      display: grid;
      grid-template-columns: 304px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
    }

    .sidebar {
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 28px 22px 22px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(11, 16, 24, 0.97), rgba(7, 11, 17, 0.93));
      box-shadow: 16px 0 50px rgba(0, 0, 0, 0.16);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 6px 26px;
    }

    .brand-mark {
      position: relative;
      display: grid;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--line-bright);
      border-radius: 50%;
      color: var(--accent);
      box-shadow: inset 0 0 18px rgba(85, 195, 211, 0.1), 0 0 24px rgba(65, 152, 166, 0.08);
    }

    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      content: "";
      background: currentColor;
      opacity: 0.7;
    }

    .brand-mark::before {
      width: 16px;
      height: 1px;
    }

    .brand-mark::after {
      width: 1px;
      height: 16px;
    }

    .brand-title {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .brand-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 7px 11px;
      color: #6e7c87;
      font-size: 10px;
      letter-spacing: 0.18em;
    }

    .count-badge {
      display: grid;
      min-width: 21px;
      height: 21px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      font-size: 9px;
    }

    .character-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .character-card {
      display: grid;
      grid-template-columns: 45px minmax(0, 1fr) 18px;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      background: transparent;
      transition: 180ms ease;
    }

    .character-card:hover {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.025);
    }

    .character-card.active {
      border-color: rgba(93, 186, 200, 0.23);
      background: linear-gradient(100deg, rgba(74, 161, 175, 0.13), rgba(74, 161, 175, 0.025));
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .character-avatar,
    .message-avatar {
      display: grid;
      place-items: center;
      border: 1px solid rgba(131, 220, 229, 0.24);
      border-radius: 50%;
      color: var(--accent);
      background: linear-gradient(145deg, rgba(47, 90, 101, 0.34), rgba(18, 31, 40, 0.58));
      font-family: Georgia, "Songti SC", serif;
      box-shadow: inset 0 0 20px rgba(83, 185, 200, 0.08);
    }

    .character-avatar {
      width: 45px;
      height: 45px;
      font-size: 18px;
    }

    .character-meta {
      min-width: 0;
    }

    .character-name {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .character-role {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #75d0bd;
      box-shadow: 0 0 10px rgba(117, 208, 189, 0.5);
    }

    .sidebar-spacer {
      flex: 1;
    }

    .system-card {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.018);
    }

    .system-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 10px;
    }

    .system-row + .system-row {
      margin-top: 10px;
    }

    .system-value {
      color: #b7c8cc;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .main-panel {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      height: 100vh;
    }

    .main-panel::before {
      position: absolute;
      top: 90px;
      right: 6%;
      width: 320px;
      height: 320px;
      pointer-events: none;
      content: "";
      border: 1px solid rgba(120, 211, 225, 0.045);
      border-radius: 50%;
      box-shadow: 0 0 0 70px rgba(120, 211, 225, 0.018), 0 0 0 140px rgba(120, 211, 225, 0.01);
    }

    .chat-header {
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 92px;
      padding: 21px 42px;
      border-bottom: 1px solid var(--line);
      background: rgba(6, 10, 15, 0.72);
      backdrop-filter: blur(18px);
    }

    .header-identity {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-sigil {
      display: grid;
      width: 49px;
      height: 49px;
      place-items: center;
      border: 1px solid var(--line-bright);
      border-radius: 50%;
      color: var(--accent);
      font-family: Georgia, serif;
      font-size: 20px;
      background: rgba(66, 139, 151, 0.09);
    }

    .header-name {
      margin: 0 0 6px;
      font-family: Georgia, "Songti SC", serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .header-actions {
      display: flex;
      gap: 9px;
    }

    .icon-button {
      display: grid;
      width: 37px;
      height: 37px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
      transition: 160ms ease;
    }

    .icon-button:hover {
      border-color: var(--line-bright);
      color: var(--accent);
      background: rgba(91, 176, 190, 0.07);
    }

    .chat-scroll {
      z-index: 1;
      overflow-y: auto;
      padding: 38px 42px 26px;
      scrollbar-color: rgba(120, 153, 164, 0.25) transparent;
      scrollbar-width: thin;
    }

    .chat-inner {
      width: min(860px, 100%);
      margin: 0 auto;
    }

    .archive-separator {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 2px 0 31px;
      color: #596872;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
    }

    .archive-separator::before,
    .archive-separator::after {
      flex: 1;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--line));
    }

    .archive-separator::after {
      background: linear-gradient(90deg, var(--line), transparent);
    }

    .message {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 13px;
      max-width: 720px;
      margin-bottom: 25px;
      animation: message-in 320ms ease both;
    }

    .message.user {
      grid-template-columns: minmax(0, 1fr) 36px;
      margin-left: auto;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      font-size: 13px;
    }

    .message.user .message-avatar {
      grid-column: 2;
      grid-row: 1;
      color: var(--warm);
      border-color: rgba(216, 183, 122, 0.24);
      background: linear-gradient(145deg, rgba(111, 84, 45, 0.34), rgba(41, 31, 23, 0.55));
    }

    .message-body {
      min-width: 0;
    }

    .message.user .message-body {
      grid-column: 1;
      grid-row: 1;
      text-align: right;
    }

    .message-author {
      display: flex;
      gap: 9px;
      align-items: center;
      margin: 1px 3px 8px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .message.user .message-author {
      justify-content: flex-end;
    }

    .message-content {
      display: inline-block;
      max-width: 100%;
      padding: 14px 17px;
      border: 1px solid var(--line);
      border-radius: 3px 13px 13px 13px;
      color: #d5e0e3;
      text-align: left;
      font-family: Georgia, "Songti SC", serif;
      font-size: 14px;
      line-height: 1.82;
      letter-spacing: 0.025em;
      background: rgba(17, 25, 35, 0.72);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
      white-space: pre-wrap;
    }

    .message.user .message-content {
      border-color: rgba(216, 183, 122, 0.17);
      border-radius: 13px 3px 13px 13px;
      background: rgba(83, 66, 43, 0.17);
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
      min-width: 54px;
      min-height: 24px;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.32s;
    }

    .composer-wrap {
      z-index: 2;
      padding: 15px 42px 27px;
      background: linear-gradient(to top, rgba(5, 8, 13, 0.98) 55%, rgba(5, 8, 13, 0));
    }

    .composer {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 10px 10px 10px 18px;
      border: 1px solid rgba(117, 154, 166, 0.2);
      border-radius: 14px;
      background: rgba(14, 21, 30, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      transition: 180ms ease;
    }

    .composer:focus-within {
      border-color: rgba(103, 202, 216, 0.43);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.42), 0 0 0 3px rgba(90, 186, 201, 0.05);
    }

    .message-input {
      width: 100%;
      min-height: 45px;
      max-height: 138px;
      padding: 11px 0 7px;
      overflow-y: auto;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 13px;
      line-height: 1.55;
    }

    .message-input::placeholder {
      color: #596873;
    }

    .send-button {
      align-self: end;
      display: grid;
      width: 45px;
      height: 45px;
      place-items: center;
      border: 1px solid rgba(103, 202, 216, 0.38);
      border-radius: 10px;
      cursor: pointer;
      color: #071014;
      background: var(--accent);
      box-shadow: 0 8px 25px rgba(71, 169, 183, 0.18);
      transition: 160ms ease;
    }

    .send-button:hover {
      transform: translateY(-1px);
      background: #a0e9ee;
    }

    .send-button:disabled {
      cursor: default;
      opacity: 0.36;
      transform: none;
    }

    .composer-hint {
      width: min(860px, 100%);
      margin: 9px auto 0;
      color: #55626b;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .mobile-menu {
      display: none;
    }

    @keyframes message-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      60%,
      100% {
        opacity: 0.28;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (max-width: 760px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(304px, 86vw);
        transform: translateX(-105%);
        transition: transform 220ms ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: grid;
      }

      .chat-header {
        min-height: 78px;
        padding: 14px 17px;
      }

      .header-sigil {
        width: 42px;
        height: 42px;
      }

      .header-name {
        font-size: 17px;
      }

      .chat-scroll {
        padding: 26px 17px 18px;
      }

      .composer-wrap {
        padding: 12px 14px 19px;
      }

      .desktop-action {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1 class="brand-title">万象会客厅</h1>
          <p class="brand-subtitle">Voices Across Time</p>
        </div>
      </div>

      <div class="section-label">
        <span>对话人物</span>
        <span class="count-badge" id="characterCount">1</span>
      </div>
      <div class="character-list" id="characterList"></div>

      <div class="sidebar-spacer"></div>
      <div class="system-card">
        <div class="system-row">
          <span>当前模式</span>
          <span class="system-value">DEEPSEEK</span>
        </div>
        <div class="system-row">
          <span>档案状态</span>
          <span class="system-value">AVAILABLE</span>
        </div>
        <div class="system-row">
          <span>会话存储</span>
          <span class="system-value">SERVER</span>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="chat-header">
        <div class="header-identity">
          <button class="icon-button mobile-menu" id="menuButton" aria-label="打开人物列表">☰</button>
          <div class="header-sigil" id="headerSigil">罗</div>
          <div>
            <h2 class="header-name" id="headerName">罗辑</h2>
            <div class="header-status">
              <span class="online-dot"></span>
              <span id="headerStatus">正在观察宇宙，也在观察你</span>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-button desktop-action" id="exportButton" aria-label="导出对话" title="导出对话">⇩</button>
          <button class="icon-button" id="clearButton" aria-label="清空对话" title="清空对话">⌫</button>
        </div>
      </header>

      <section class="chat-scroll" id="chatScroll" aria-live="polite">
        <div class="chat-inner" id="chatMessages">
          <div class="archive-separator">档案连接已建立 · 现在</div>
        </div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea class="message-input" id="messageInput" rows="1" maxlength="1000" placeholder="向罗辑发送消息……" aria-label="输入消息"></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="发送消息">➤</button>
        </form>
        <div class="composer-hint">Enter 发送 · Shift + Enter 换行 · 人物设定与模型密钥均由服务器安全加载</div>
      </footer>
    </main>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
